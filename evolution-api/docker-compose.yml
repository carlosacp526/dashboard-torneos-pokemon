services:
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      # Cambiá esta clave por algo largo y único: es tu API key
      - AUTHENTICATION_API_KEY=Poketubi_123
      - AUTHENTICATION_TYPE=apikey
      - CONFIG_SESSION_PHONE_CLIENT=Poketubi
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - QRCODE_LIMIT=30
      - LOG_LEVEL=ERROR
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store

volumes:
  evolution_instances:
  evolution_store:
